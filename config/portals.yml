# job-radar scanner config (read by career-ops scan.mjs / scan-ats-full.mjs in CI).
# Target: demand & supply planning, S&OP/IBP leadership. Live postings only.
max_posting_age_days: 3

# Aggregator employers (job boards that re-list other companies' roles).
# Not a career-ops key (scan.mjs ignores it); read by job-radar post-processing.
aggregator_companies: [jobgether, ladders, theladders, jobicy, remotestack, remote rocketship, lensa]

title_filter:
  positive:
    # -- Core planning --
    - "Demand Plann"
    - "Supply Plann"
    - "Inventory Plann"
    - "Inventory Manag"
    - "Replenishment"
    - "Forecast"
    - "S&OP"
    - "S&OE"
    - "word:IBP"
    - "Integrated Business Planning"
    - "Sales and Operations Planning"
    - "Sales & Operations Planning"
    - "Supply Chain Plann"
    - "Planning Manager"
    - "Planning Director"
    - "Planning Lead"
    - "Head + Planning"
    - "Director + Planning"
    - "VP + Planning"
    - "Senior Planner"
    - "Sr. Planner"
    - "Lead Planner"
    - "Merchandise Plann"
    - "Open to Buy"
    # -- Supply chain / ops leadership (DTC archetype) --
    - "Director + Supply Chain"
    - "Head + Supply Chain"
    - "VP + Supply Chain"
    - "Supply Chain Manager"
    - "Head of Operations"
    - "Director of Operations"
    # -- Transformation / consulting (planning-systems vendors) --
    - "Supply Chain + Consultant"
    - "Planning + Consultant"
    - "Solution Consultant"
    - "Functional Consultant"
    - "Supply Chain Transformation"
    - "Supply Chain Analytics"
    - "Solution Principal"
    - "Presales + Planning"
    - "Pre-Sales + Planning"
    # -- Spanish / Portuguese --
    - "Planeación"
    - "Planeacion"
    - "Planificación"
    - "Planificacion"
    - "Planejamento"
    - "Demanda"
    - "Abastecimiento"
    - "Cadena de Suministro"
    - "Cadena de Abastecimiento"
    - "Supply Chain"

  negative:
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Junior"
    - "word:Jr"
    - "Assistant"
    - "Auxiliar"
    - "Practicante"
    - "Aprendiz"
    - "Pasante"
    - "Warehouse Associate"
    - "Driver"
    - "Event Plann"
    - "Financial Plann"
    - "Media Plann"
    - "Account Plann"
    - "Estate Plann"
    - "Urban Plann"
    - "Travel Plann"
    - "Wedding"
    - "Production Plann"
    - "Workforce Plann"
    - "Software Engineer"
    - "Data Engineer"
    - "Data Scientist"
    - "Director of Engineering"
    - "Working Student"
    - "Coordinator"
    - "word:Shift"
    - "Quality Manager"
    # -- Corporate / finance / HR "planning" (not supply chain) --
    - "Legal"
    - "Environmental"
    - "Compensation"
    - "Benefits"
    - "Payroll"
    - "Treasury"
    - "word:Tax"
    - "word:Budget"
    - "Presupuesto"
    - "Control de Gestión"
    - "Estratégic"
    - "Strategic Plann"
    - "Strategy & Planning"
    - "Strategy and Planning"
    - "Clinical"
    - "Revenue"
    - "Sales Operations"
    - "word:GTM"
    - "word:PDM"
    - "AI Solutions"
    # -- Other planning professions --
    - "Urban"
    - "City Plann"
    - "Transportation Plann"
    - "stem:Event"
    # -- Tool-specialist / IT-architecture titles --
    - "Architect"
    - "Anaplan"
    - "word:o9"
    # -- Vendor-board sales & engineering noise --
    - "Account Executive"
    - "Account Director"
    - "Account Manager"
    - "Strategic Accounts"
    - "Sales Enablement"
    - "Support Engineer"
    - "Developer"

