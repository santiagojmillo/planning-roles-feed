name: job-radar

on:
  schedule:
    # GitHub delays scheduled runs on this repo by 7–9 h (seen 2026-10-12 and
    # 2026-10-13), so fire six off-minute attempts, one every 2 h from 00:23 to
    # 10:23 UTC. The guard step skips once today's (UTC) results are published or
    # another run is already active, so at most one attempt does real work.
    - cron: '23 0 * * *'    # 19:23 Bogotá (previous evening)
    - cron: '23 2 * * *'    # 21:23 Bogotá
    - cron: '23 4 * * *'    # 23:23 Bogotá
    - cron: '23 6 * * *'    # 01:23 Bogotá
    - cron: '23 8 * * *'    # 03:23 Bogotá
    - cron: '23 10 * * *'   # 05:23 Bogotá
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's results already exist or another run is active"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # guard step lists this workflow's runs with gh

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Guard (skip if today's results exist or another run is active)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          skip() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "SKIP: $*"; exit 0; }

          if [ "$FORCE" = "true" ]; then
            echo "force=true ($EVENT): running even if today's results exist or another run is active."
          else
            # 1) Today's results already on origin/main? Applies to schedule AND workflow_dispatch.
            git fetch -q origin main || echo "warn: could not fetch origin/main; treating as no results yet"
            published=$(git show origin/main:out/latest.json 2>/dev/null | grep -o '"generated_at": "[^"]*' | head -1 | cut -d'"' -f4 || true)
            if [ "${published:0:10}" = "$today" ]; then
              skip "results for $today (UTC) already published on origin/main (generated_at=$published, event=$EVENT). Re-run with force=true to override."
            fi
            echo "no results for $today on origin/main yet (latest generated_at=${published:-none})."

            # 2) Another run of this workflow in progress or queued? Ignore this run's own id.
            for status in in_progress queued; do
              others=$(gh run list -R "$REPO" --workflow radar.yml --status "$status" --json databaseId \
                         --jq "[.[] | select(.databaseId != $RUN_ID)] | length" 2>/dev/null || echo 0)
              if [ "${others:-0}" -gt 0 ] 2>/dev/null; then
                skip "another job-radar run is $status ($others other run(s); this run is $RUN_ID) — letting it finish instead."
              fi
              echo "no other run $status."
            done
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "proceeding (event=$EVENT, force=${FORCE:-false}, today=$today)."

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Today's date (UTC)
        id: day
        if: steps.guard.outputs.skip != 'true'
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Same UTC day → reuse that day's Google results instead of paying again. They live in the Actions cache (not
      # in git), so re-runs on an older commit and queued runs find them too, and the publish step never conflicts.
      - name: Restore today's Google results
        id: gcache
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: tmp/google-cache.json
          key: google-cache-${{ steps.day.outputs.day }}

      # The Apify token lives ONLY in this step: the later steps run third-party code (career-ops and its npm
      # dependencies), which never sees it.
      - name: LinkedIn posts via Google (Apify)
        if: steps.guard.outputs.skip != 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}   # optional — see README "LinkedIn posts via Google"
          RADAR_DAYS: '3'
          RADAR_TODAY: ${{ steps.day.outputs.day }}
        run: |
          mkdir -p tmp logs
          rm -f state/google-cache.json   # old location (commit 175632c kept it in git); the publish step records the removal
          node radar/collect-google.mjs > tmp/google.json 2> logs/google.log || true
          cat logs/google.log

      - name: Save today's Google results
        if: steps.guard.outputs.skip != 'true' && steps.gcache.outputs.cache-hit != 'true' && hashFiles('tmp/google-cache.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tmp/google-cache.json
          key: google-cache-${{ steps.day.outputs.day }}

      - name: Fetch career-ops (pinned)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git clone --filter=blob:none https://github.com/career-ops-hq/career-ops.git career-ops
          git -C career-ops checkout 8cb0161f
          cd career-ops && npm install --ignore-scripts --no-audit --no-fund

      - name: Collect live roles
        if: steps.guard.outputs.skip != 'true'
        env:
          RADAR_GOOGLE_PRECOLLECTED: '1'   # tmp/google.json comes from the step above
        run: bash radar/run.sh

      - name: Publish results
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add -A out state logs/sweep-summary.log 2>/dev/null || true
          git commit -m "radar $(date -u +%F)" || exit 0
          git pull --rebase
          git push
